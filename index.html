popup-scrolled{overflow:auto}.leaflet-div-icon{background:#fff;border:1px solid #666}
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2128;--mut:#667085;--line:#e3e6ea;--acc:#1f6f4a}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--fg:#e6e8ea;--mut:#9aa3ad;--line:#2d333a;--acc:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0}
#count{color:var(--mut)}
main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 49px)}
aside{padding:12px 16px;overflow:auto;border-right:1px solid var(--line);background:var(--card)}
aside label{display:block;margin:10px 0 3px;font-weight:600;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;gap:6px}
button{margin-top:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
.tabs{display:flex;gap:4px;padding:8px 12px 0}
.tabs button{margin:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
section{display:flex;flex-direction:column;min-width:0}
#tablewrap{overflow:auto;flex:1;margin:0 12px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
#map{flex:1;margin:0 12px 12px;border:1px solid var(--line);border-radius:6px;display:none}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
tr:hover td{background:color-mix(in srgb,var(--acc) 10%,transparent)}
#more{display:block;margin:10px auto}
@media(max-width:760px){main{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}#tablewrap{height:70vh;flex:none}#map{height:70vh;flex:none}}
</style>
</head>
<body>
<header><h1>Montpelier, VT — Property Finder</h1><span id="count"></span></header>
<main>
<aside>
  <label>Search (address, owner, SPAN)</label><input id="q" type="search" placeholder="e.g. State St">
  <label>Property type</label><select id="cat"></select>
  <label>Assessed value ($)</label>
  <div class="row"><input id="vmin" type="number" placeholder="min"><input id="vmax" type="number" placeholder="max"></div>
  <label>Acres</label>
  <div class="row"><input id="amin" type="number" step="any" placeholder="min"><input id="amax" type="number" step="any" placeholder="max"></div>
  <label>Homestead</label>
  <select id="hs"><option value="">Any</option><option value="y">Has homestead value</option><option value="n">No homestead</option></select>
  <label>Has building</label>
  <select id="imp"><option value="">Any</option><option value="y">Improved (building value &gt; 0)</option><option value="n">Land only</option></select>
  <button id="reset">Reset filters</button>
  <p style="color:var(--mut);font-size:12px">Source: Vermont Center for Geographic Information statewide parcel data with Grand List values. Values are listed (assessed) values, not sale prices.</p>
</aside>
<section>
  <div class="tabs"><button id="tt" class="on">Table</button><button id="tm">Map</button></div>
  <div id="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table><button id="more">Show more</button></div>
  <div id="map"></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const CATS={R1:'Residential (<6 ac)',R2:'Residential (6+ ac)',C:'Commercial',CA:'Commercial apartments',O:'Other / condo',M:'Mobile home (landed)',MHL:'Mobile home (leased land)',I:'Industrial',UE:'Utility – electric',S1:'Seasonal'};
const COLS=[['address','Address'],['owner','Owner'],['cat','Type'],['value','Assessed $',1],['land','Land $',1],['imp','Building $',1],['acres','Acres',1],['span','SPAN']];
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'':'$'+n.toLocaleString();
let data=[],view=[],sort={k:'address',d:1},shown=100,map,layer;
const title=s=>(s||'').replace(/\s+/g,' ').trim();
fetch('data.json').then(r=>r.json()).then(rows=>{
  data=rows.map(r=>({address:title(r.E911ADDR||r.LOCAPROP||r.DESCPROP),owner:title([r.OWNER1,r.OWNER2].filter(Boolean).join(' / ')),
    cat:r.CAT||'',value:r.REAL_FLV||0,land:r.LAND_LV||0,imp:r.IMPRV_LV||0,hs:r.HSTED_FLV||0,acres:r.ACRESGL||0,span:r.SPAN,lat:r.lat,lng:r.lng,desc:title(r.DESCPROP)}));
  data.forEach(d=>d.hay=(d.address+' '+d.owner+' '+d.span+' '+d.desc).toLowerCase());
  const cs=[...new Set(data.map(d=>d.cat))].sort();
  $('cat').innerHTML='<option value="">All types</option>'+cs.map(c=>`<option value="${c}">${CATS[c]||c||'Unknown'}</option>`).join('');
  $('head').innerHTML=COLS.map(([k,l,n])=>`<th data-k="${k}" class="${n?'n':''}">${l}</th>`).join('');
  $('head').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sort=sort.k==k?{k,d:-sort.d}:{k,d:1};apply()};
  apply();
});
function apply(){
  const q=$('q').value.toLowerCase().trim(),cat=$('cat').value,hs=$('hs').value,imp=$('imp').value;
  const n=id=>$(id).value===''?null:+$(id).value;
  const vmin=n('vmin'),vmax=n('vmax'),amin=n('amin'),amax=n('amax');
  view=data.filter(d=>(!q||d.hay.includes(q))&&(!cat||d.cat===cat)&&(vmin==null||d.value>=vmin)&&(vmax==null||d.value<=vmax)
    &&(amin==null||d.acres>=amin)&&(amax==null||d.acres<=amax)&&(!hs||(hs=='y')==(d.hs>0))&&(!imp||(imp=='y')==(d.imp>0)));
  const {k,d}=sort;
  view.sort((a,b)=>(typeof a[k]=='number'?a[k]-b[k]:String(a[k]).localeCompare(String(b[k]),undefined,{numeric:true}))*d);
  shown=100;render();
}
function render(){
  $('count').textContent=`${view.length.toLocaleString()} of ${data.length.toLocaleString()} properties`;
  $('body').innerHTML=view.slice(0,shown).map(d=>`<tr><td>${esc(d.address)}</td><td>${esc(d.owner)}</td><td>${CATS[d.cat]||d.cat}</td><td class="n">${fmt(d.value)}</td><td class="n">${fmt(d.land)}</td><td class="n">${fmt(d.imp)}</td><td class="n">${d.acres.toFixed(2)}</td><td>${esc(d.span)}</td></tr>`).join('');
  $('more').style.display=view.length>shown?'block':'none';
  if(map&&$('map').style.display=='block')drawMap();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('more').onclick=()=>{shown+=200;render()};
['q','cat','vmin','vmax','amin','amax','hs','imp'].forEach(id=>$(id).addEventListener('input',apply));
$('reset').onclick=()=>{document.querySelectorAll('aside input,aside select').forEach(e=>e.value='');apply()};
function drawMap(){
  layer.clearLayers();
  view.filter(d=>d.lat).forEach(d=>L.circleMarker([d.lat,d.lng],{radius:4,weight:1,color:'#1f6f4a',fillOpacity:.6})
    .bindPopup(`<b>${esc(d.address)}</b><br>${esc(d.owner)}<br>${CATS[d.cat]||d.cat} · ${fmt(d.value)} · ${d.acres.toFixed(2)} ac`).addTo(layer));
}
$('tm').onclick=()=>{
  $('tablewrap').style.display='none';$('map').style.display='block';$('tm').classList.add('on');$('tt').classList.remove('on');
  if(!map){map=L.map('map').setView([44.26,-72.575],14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map)}
  map.invalidateSize();drawMap();
};
$('tt').onclick=()=>{$('tablewrap').style.display='';$('map').style.display='none';$('tt').classList.add('on');$('tm').classList.remove('on')};
</script>
</body>
</html>
